# nginx — the single public surface of the all-in-one EC2 box.
#
# Serves the built SPA and reverse-proxies the API on the SAME ORIGIN. That is the
# point of putting it here: same-origin means no CORS preflight, no SameSite=None
# cookie, and no cross-site CSRF-origin dance for the session auth the SPA uses.
# It also means one open port (80) instead of two.

server {
    listen 80 default_server;
    server_name _;

    # Docker's embedded DNS. Resolving the backend through a VARIABLE (below) defers
    # the lookup to request time. A static `upstream` block would be resolved once at
    # startup, so nginx would refuse to boot with "host not found in upstream" any
    # time it came up before the backend container — and would stay down after.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sdlc_backend "backend:8000";

    # Brownfield onboarding uploads whole PDFs/Word/Excel docs through the API
    # (api/views.py — request.FILES). nginx's 1 MB default would 413 them.
    client_max_body_size 200m;

    # ── API ───────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://$sdlc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long, on purpose. Two callers here legitimately take minutes:
        #   * the companion's platform-state calls, whose own client allows 900s
        #     (runner/companion/state_client.py SLOW_TIMEOUT_S — a 60s cap once
        #     caused an a11y audit to be closed twice and 1,065 elements written off);
        #   * the companion's /api/runner/work/ claim poll.
        # A proxy that gives up earlier than the client re-creates that bug at the
        # network layer, where it is much harder to see.
        proxy_read_timeout    960s;
        proxy_send_timeout    960s;
        proxy_connect_timeout 30s;

        # Server-Sent Events / streamed responses must not sit in a buffer.
        proxy_buffering off;
    }

    # ── Django admin + DRF browsable API ──────────────────────────────
    location /admin/ {
        proxy_pass http://$sdlc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django's own static files (admin CSS, DRF browsable API). These are served by
    # Django ONLY while DJANGO_DEBUG=true — the project defines no STATIC_ROOT, so
    # there is nothing to collectstatic into. With DEBUG=false these 404 and the
    # admin renders unstyled; the JSON API is unaffected. See README "Known gaps".
    location /static/ {
        proxy_pass http://$sdlc_backend;
        proxy_set_header Host $host;
    }

    # Vite emits content-hashed filenames, so they are safe to cache forever.
    # Declared before the catch-all so it wins for /assets/*.
    location /assets/ {
        root /srv/www;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NEVER be cached, or a browser keeps loading the old bundle
    # after a redeploy and reports "my fix isn't there".
    location = /index.html {
        root /srv/www;
        add_header Cache-Control "no-store";
    }

    # ── The SPA ───────────────────────────────────────────────────────
    location / {
        root /srv/www;
        # React Router owns the paths — every unknown URL is an app route, not a 404.
        try_files $uri $uri/ /index.html;
    }
}
