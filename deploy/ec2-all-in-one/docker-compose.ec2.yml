# ─────────────────────────────────────────────────────────────────────────
# docker-compose.ec2.yml — the whole app + infra on one EC2 box (testing / staging),
# with artifact bodies in REAL AWS S3 (no MinIO — see "Object store" below).
#
# Differs from the root docker-compose.yml (a developer's laptop) in five ways:
#   1. nginx on :80 is the ONLY public port. It serves the built SPA and proxies
#      /api/ to the backend, so the app and the API are SAME-ORIGIN — no CORS
#      preflight, no cross-site cookie, no CSRF-origin puzzle.
#   2. Every other port binds to 127.0.0.1 (Postgres, Temporal, Temporal UI, and
#      the backend itself). Reach them with an SSH tunnel, not a security-group hole.
#   5. No MinIO: artifact bodies go to a real S3 bucket.
#   3. The frontend is BUILT (`npm run build`) into a webroot volume by a
#      one-shot service, not served by `vite dev`.
#   4. The backend runs without --reload.
#
# It is standalone, NOT an override — merging `ports:` lists with the root file
# would append the laptop's public bindings back on rather than replace them.
#
# Run FROM THE REPO ROOT on the EC2 box:
#   docker compose -f deploy/ec2-all-in-one/docker-compose.ec2.yml up -d --build
# (relative paths below resolve against THIS file's directory, hence ../..)
#
# See README.md in this directory for the full runbook.
# ─────────────────────────────────────────────────────────────────────────

name: sdlc-platform-ec2

services:
  # ─── Application database (app data + Temporal persistence) ───────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sdlc_platform}
    ports:
      # LOOPBACK ONLY. `psql` from the box, or tunnel: ssh -L 5433:localhost:5433
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─── Temporal (durable execution) ─────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PWD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      # Loopback only: the worker reaches Temporal over the compose network as
      # `temporal:7233`. Nothing off-box needs 7233 in this topology — unlike the
      # shared-aws runbook, where the workers live on developers' laptops.
      - "127.0.0.1:7233:7233"
    volumes:
      # Carries the worker-versioning flags (see README "Worker versioning").
      - ../../docker/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      # Only ever loaded through an SSH tunnel, so localhost is the real origin.
      TEMPORAL_CORS_ORIGINS: http://localhost:8080
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  # ─── Object store ─────────────────────────────────────────────────
  # NO MinIO here — this deployment uses REAL AWS S3. Django's object store reads
  # settings.S3_ENDPOINT_URL (backend/storage/object_store.py); leaving it EMPTY in
  # .env makes boto3 talk to AWS S3 directly (ADR-0001). Nothing to run on the box.
  #
  # The bucket is never reached by a browser: the platform issues no presigned URLs
  # — artifact bodies are read server-side and served through the API — so the
  # bucket stays fully private and needs no CORS configuration.

  # ─── Django API ───────────────────────────────────────────────────
  backend:
    build:
      context: ../../backend
      args:
        SDLC_BUILD_STAMP: "${SDLC_BUILD_STAMP:-}"
    env_file: [../../.env]
    environment:
      # Repo root on the path so the API can import mcp_platform_state.
      PYTHONPATH: /repo
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback only — nginx proxies to it over the compose network.
      - "127.0.0.1:8000:8000"
    volumes:
      - ../..:/repo
    working_dir: /repo/backend
    # No --reload: this is a staging box, restarted deliberately after `git pull`.
    command: ["uvicorn", "config.asgi:application", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  # ─── Temporal worker ──────────────────────────────────────────────
  worker:
    build:
      context: ../../backend
      args:
        SDLC_BUILD_STAMP: "${SDLC_BUILD_STAMP:-}"
    env_file: [../../.env]
    environment:
      PYTHONPATH: /repo
    depends_on:
      temporal:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ../..:/repo
    working_dir: /repo/backend
    command: ["python", "-m", "orchestration.worker"]
    restart: unless-stopped

  # ─── Frontend: build once into the webroot, then exit ─────────────
  # VITE_API_BASE is inlined at BUILD time, and it is also what the Connect
  # Machine screen uses to print each user's `companion serve` command — so it
  # must be the address users actually type in their browser, never localhost.
  frontend-build:
    image: node:24-alpine
    working_dir: /app
    env_file: [../../.env]
    volumes:
      - ../../frontend:/app
      # Anonymous volume: the container keeps its own linux node_modules and
      # doesn't clash with any host-built esbuild/rollup binaries.
      - /app/node_modules
      - webroot:/srv/www
    command: >
      sh -c "npm ci &&
             npm run build &&
             rm -rf /srv/www/* &&
             cp -r dist/. /srv/www/ &&
             echo 'frontend published to webroot'"
    restart: "no"

  # ─── nginx: the only public surface ───────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      frontend-build:
        condition: service_completed_successfully
      backend:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - webroot:/srv/www:ro
    restart: unless-stopped

volumes:
  pgdata:
  webroot:
