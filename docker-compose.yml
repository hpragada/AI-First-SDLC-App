# ───────────────────────────────────────────────────────────────────
# AI-First SDLC Platform — local dev stack
#
# Default `docker compose up -d` brings up INFRA only:
#   postgres (pgvector) · temporal (+ ui) · minio (+ bucket init)
#
# App services (backend api, temporal worker, mcp server, frontend) live
# under the `app` profile and are wired up in later P0 tasks (T2/T5/T8/T12):
#   docker compose --profile app up -d
#
# Image tags pinned to best-known-stable; bump if a pull fails.
# ───────────────────────────────────────────────────────────────────

name: sdlc-platform

services:
  # ─── Application database (app data + Temporal persistence) ───────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sdlc_platform}
    ports:
      # Host 5433 → container 5432, to avoid clashing with a native Postgres on 5432.
      # In-container services still use postgres:5432 over the Docker network.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─── Temporal (durable execution) ─────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PWD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./docker/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    restart: unless-stopped

  # ─── MinIO (S3-compatible object store for artifact bodies) ───────
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/${S3_BUCKET:-sdlc-artifacts};
      echo 'bucket ready: ${S3_BUCKET:-sdlc-artifacts}';
      "
    restart: "no"

  # ─── App services (built in later P0 tasks; profile-gated) ────────
  backend:
    profiles: ["app"]
    build:
      context: ./backend
      # Same args as the worker, so both services resolve to one image.
      args:
        SDLC_BUILD_STAMP: "${SDLC_BUILD_STAMP:-}"
    env_file: [.env]
    environment:
      # Repo root on the path so the API can import mcp_platform_state (the gate /
      # trigger services log events through it), mirroring the worker.
      PYTHONPATH: /repo
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/repo
    working_dir: /repo/backend
    command: ["uvicorn", "config.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    profiles: ["app"]
    build:
      context: ./backend
      # Dates the image so a worker can say which build it came from. Leave it
      # unset and the image dates itself at build time; either way the worker
      # falls back to dating the mounted code below, which is what it runs.
      args:
        SDLC_BUILD_STAMP: "${SDLC_BUILD_STAMP:-}"
    env_file: [.env]
    environment:
      # Repo root on the path so the worker can import mcp_platform_state.
      PYTHONPATH: /repo
    depends_on:
      temporal:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - .:/repo
    working_dir: /repo/backend
    command: ["python", "-m", "orchestration.worker"]

  frontend:
    profiles: ["app"]
    image: node:24-alpine
    working_dir: /app
    environment:
      # Browser-side base URL (the host-mapped backend); CORS allows :5173.
      VITE_API_BASE: http://localhost:8000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Anonymous volume so the container keeps its own (linux) node_modules and
      # doesn't clash with the host's platform-specific binaries (esbuild/rollup).
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  # NOTE: the Platform-State MCP server (P0-T5) is NOT a long-running service.
  # It reuses the Django ORM and is launched on-demand over stdio by the ClaudeDriver
  # (P0-T6) as a subprocess of the `worker`, via:
  #   PYTHONPATH=<repo-root> python -m mcp_platform_state.server
  # (Run inside the backend image, which already has Django + mcp.)

volumes:
  pgdata:
  miniodata:
